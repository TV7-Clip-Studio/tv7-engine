name: Engine checks
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tv7-engine
      - uses: actions/checkout@v4
        with:
          repository: TV7-Clip-Studio/tv7-core
          ref: db56983f46e5162955c9ab217983967a3f3584cc
          path: tv7-core
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pkg-config
      - run: cargo fmt --all -- --check && cargo test --locked --workspace --all-targets
        working-directory: tv7-engine
