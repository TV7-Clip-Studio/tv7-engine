repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: make-quality
        name: make quality
        entry: make quality
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|Makefile|deny\.toml|.*\.rs)$
